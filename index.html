<style>
  :root{
    --ink:#182430;
    --paper:#eef2f6;
    --card:#ffffff;
    --line:#d6dee6;
    --teal:#1e3a5f;
    --teal-deep:#12233a;
    --gold:#2f9e6b;
    --gold-soft:#e3f3ea;
    --rust:#b3261e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family: -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;
    background: var(--paper);
    color: var(--ink);
    display:flex;
    justify-content:center;
    padding: 0;
  }
  .app-shell{
    width:100%;
    max-width:none;
    min-height: 100vh;
    display:flex;
    flex-direction:column;
    background: var(--paper);
    border-radius:0;
    overflow:hidden;
    box-shadow:none;
  }
  @media (max-width:720px){
    body{ padding:0; }
    .app-shell{ border-radius:0; min-height:100vh; box-shadow:none; }
  }
  header.masthead{
    background: linear-gradient(180deg,var(--teal) 0%, var(--teal-deep) 100%);
    color:#eef3f1;
    padding: 18px 22px 0;
    border-bottom: 4px solid var(--gold);
    flex:none;
  }
  header.masthead .top{
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:10px 20px;
  }
  header.masthead .brand{
    display:flex;
    align-items:center;
    gap:12px;
  }
  header.masthead .app-logo{
    width:44px;
    height:44px;
    border-radius:10px;
    flex:none;
    object-fit:cover;
  }
  header.masthead .kicker{
    letter-spacing:.08em;
    text-transform:uppercase;
    font-size:12px;
    color:#a9c9c2;
    margin:0 0 4px;
    font-family: Georgia, 'Noto Serif', serif;
  }
  header.masthead h1{
    margin:0 0 10px;
    font-size: 21px;
    font-weight:700;
    font-family: Georgia, 'Noto Serif', serif;
  }
  nav.tabs{
    display:flex;
    justify-content:center;
    gap:6px;
    padding-top:4px;
    flex-wrap:wrap;
  }
  nav.tabs button{
    font-family: -apple-system, sans-serif;
    font-size:13.5px;
    font-weight:600;
    color:#d7e6e0;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.16);
    border-bottom:none;
    padding: 10px 18px;
    border-radius: 6px 6px 0 0;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:8px;
    transition: background .15s, color .15s;
  }
  nav.tabs button .dot{
    width:7px;height:7px;border-radius:50%;
    background:#6f8f86;
    flex:none;
  }
  nav.tabs button:hover{ background: rgba(255,255,255,0.13); color:#fff; }
  nav.tabs button.active{
    background: var(--paper);
    color: var(--teal-deep);
    border-color: var(--paper);
  }
  nav.tabs button.active .dot{ background: var(--gold); }

  main.frame-wrap{
    flex:1;
    min-height:0;
    position:relative;
    background:var(--paper);
  }
  iframe{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    border:none;
    display:none;
    background:var(--paper);
  }
  iframe.active{ display:block; }

  .loading-hint{
    position:absolute;
    top:50%; left:50%;
    transform:translate(-50%,-50%);
    font-size:13px;
    color:#8a8272;
    font-family: Georgia, serif;
  }
  .install-btn{
    font-family: -apple-system, sans-serif;
    font-size:13px;
    font-weight:600;
    color: var(--teal-deep);
    background: var(--gold);
    border: 1px solid #248257;
    border-radius: 7px;
    padding: 9px 14px;
    cursor:pointer;
    white-space:nowrap;
  }
  .install-btn:hover{ filter: brightness(1.05); }
  .ios-install-tip{
    position:fixed;
    left:12px; right:12px; bottom:12px;
    z-index:999;
    background:#fff;
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:0 4px 18px rgba(0,0,0,0.18);
    padding:12px 14px;
    font-family: -apple-system, sans-serif;
    font-size:13px;
    color:var(--ink);
    display:flex;
    align-items:center;
    gap:10px;
  }
  .ios-install-tip button{
    margin-left:auto;
    border:none;
    background:transparent;
    font-size:16px;
    cursor:pointer;
    color:#8a8272;
    flex:none;
  }
</style>
</head>
<body>

<div class="app-shell">
  <header class="masthead">
    <div class="top">
      <div class="brand">
        <img id="appLogoImg" alt="Logo" class="app-logo">
        <div>
          <p class="kicker">Police / Investigation Toolkit — Annexure IX</p>
          <h1>CDR · IPDR · Tower CDR — Formatter Suite</h1>
        </div>
      </div>
      <button id="btnInstallApp" class="install-btn" style="display:none;" type="button">⬇ એપ ઇન્સ્ટોલ કરો</button>
    </div>
    <nav class="tabs" id="tabs">
      <button class="tab-btn active" data-target="frame-cdr"><span class="dot"></span> CDR Form</button>
      <button class="tab-btn" data-target="frame-ipdr"><span class="dot"></span> IPDR Form</button>
      <button class="tab-btn" data-target="frame-tower"><span class="dot"></span> Tower CDR Formatter</button>
      <button class="tab-btn" data-target="frame-certified"><span class="dot"></span> CERTIFIED CDR</button>
    </nav>
  </header>

  <main class="frame-wrap">
    <div class="loading-hint" id="loadingHint">લોડ થાય છે…</div>
    <iframe id="frame-cdr" class="active" title="CDR Form"></iframe>
    <iframe id="frame-ipdr" title="IPDR Form"></iframe>
    <iframe id="frame-tower" title="Tower CDR Formatter"></iframe>
    <iframe id="frame-certified" title="CERTIFIED CDR"></iframe>
  </main>

<script>
  // favicon, apple-touch-icon અને હેડરનો લોગો — ત્રણેય એક જ આઇકન (window.__ICON192_B64__) વાપરે છે.
  (function(){
    const src = "data:image/png;base64," + window.APP_ICON_192;
    const fav = document.getElementById('favIcon'); if(fav) fav.href = src;
    const apple = document.getElementById('appleTouchIcon'); if(apple) apple.href = src;
    const logo = document.getElementById('appLogoImg'); if(logo) logo.src = src;
  })();

  // base64 -> ખરેખર JS string (UTF-8 ડિકોડ સાથે, જેથી ગુજરાતી લખાણ સાચું રહે),
  // જેને iframe.srcdoc માં સીધો આપી શકાય.
  // નોંધ: પહેલાં અહીં Blob + URL.createObjectURL() વાપરીને દરેક iframe ને એક અલગ
  // "blob:" URL આપવામાં આવતું હતું. સમસ્યા: દરેક પેજ-લોડ વખતે નવો blob: URL બને છે,
  // અને બ્રાઉઝર દરેક નવા blob: URL ને સાવ નવી/અલગ "ઓરિજિન" ગણે છે — એટલે તેની પોતાની

  // સચવાય છે) પેજ રીફ્રેશ કરવા પર / ફરી ખોલવા પર "ડિલીટ" થયેલ દેખાતી હતી — ખરેખર એ ડિલીટ
  // નહોતી થતી, પણ જૂના blob: URL ની સ્ટોરેજ સુધી નવો blob: URL પહોંચી જ નહોતો શકતો.
  // ઉકેલ: iframe.srcdoc વાપરવું — srcdoc વાળા iframeની "ઓરિજિન" મુખ્ય પેજ (આ ફાઇલ) જેવી જ
  // અને દરેક વખતે એક સરખી રહે છે, એટલે localStorage કાયમ એક જ જગ્યાએ સચવાય અને ટકી રહે.
  function b64ToHtml(b64){
    const binStr = atob(b64);
    const len = binStr.length;
    const bytes = new Uint8Array(len);
    for(let i=0;i<len;i++) bytes[i] = binStr.charCodeAt(i);
    return new TextDecoder("utf-8").decode(bytes);
  }

  const tabs = document.querySelectorAll('.tab-btn');
  const frames = document.querySelectorAll('iframe');
  const hint = document.getElementById('loadingHint');
  let loaded = 0;
  frames.forEach(f => f.addEventListener('load', () => {
    loaded++;
    if(loaded >= frames.length) hint.style.display = 'none';
  }));

  document.getElementById('frame-cdr').srcdoc   = b64ToHtml(document.getElementById('b64-cdr').textContent.trim());
  document.getElementById('frame-ipdr').srcdoc  = b64ToHtml(document.getElementById('b64-ipdr').textContent.trim());
  document.getElementById('frame-tower').srcdoc = b64ToHtml(document.getElementById('b64-tower').textContent.trim());
  document.getElementById('frame-certified').srcdoc = b64ToHtml(document.getElementById('b64-certified').textContent.trim());

  tabs.forEach(btn => {
    btn.addEventListener('click', () => {
      tabs.forEach(b => b.classList.remove('active'));
      frames.forEach(f => f.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById(btn.dataset.target).classList.add('active');
    });
  });

  // ---- ઓટો-અપડેટ: જો GitHub પર નવું વર્ઝન પબ્લિશ થયું હોય તો જૂનું (કેશ થયેલ) પેજ
  // જાતે જ તાજું (reload) થઈ જાય, અધિકારીને જાતે Ctrl+F5 કરવાની જરૂર ન પડે. ----
  (function(){
    try{
      const KEY = "toolkit_update_check_ts";
      const now = Date.now();
      const last = parseInt(sessionStorage.getItem(KEY) || "0", 10);
      if(now - last < 20000) return; // દર ૨૦ સેકન્ડે એક વાર તપાસ (વધુ નેટવર્ક રિકવેસ્ટ ટાળવા)
      sessionStorage.setItem(KEY, String(now));
      fetch(location.href, {cache:"no-store"}).then(r => r.text()).then(freshHtml => {
        const m = freshHtml.match(/__APP_BUILD__\s*=\s*"([^"]+)"/);
        if(m && m[1] && m[1] !== window.__APP_BUILD__){
          location.reload();
        }
      }).catch(()=>{});
    }catch(e){}
  })();
  document.addEventListener("visibilitychange", () => {
    if(document.visibilityState === "visible"){
      try{
        const KEY = "toolkit_update_check_ts";
        sessionStorage.removeItem(KEY);
      }catch(e){}
    }
  });

  // ---- એપ્લિકેશન તરીકે ઇન્સ્ટોલ કરો (Android/ડેસ્કટોપ Chrome/Edge) ----
  // બ્રાઉઝર "ઇન્સ્ટોલ કરી શકાય તેવું" ગણે ત્યારે beforeinstallprompt ઇવેન્ટ મળે છે;
  // તેને સાચવી રાખી, ઉપરના "⬇ એપ ઇન્સ્ટોલ કરો" બટન ક્લિક પર બતાવીએ છીએ.
  let deferredInstallPrompt = null;
  const installBtn = document.getElementById('btnInstallApp');
  window.addEventListener('beforeinstallprompt', (e) => {
    e.preventDefault();
    deferredInstallPrompt = e;
    if(installBtn) installBtn.style.display = '';
  });
  if(installBtn){
    installBtn.addEventListener('click', async () => {
      if(!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.style.display = 'none';
    });
  }
  window.addEventListener('appinstalled', () => {
    if(installBtn) installBtn.style.display = 'none';
  });

  // iOS Safari "beforeinstallprompt" સપોર્ટ નથી કરતું — ત્યાં જાતે Share → "Add to Home Screen"
  // કરવાની રીત ટૂંકમાં બતાવીએ છીએ (ફક્ત એક જ વાર, iOS Safari પર, જો પહેલેથી ઇન્સ્ટોલ કરેલ ના હોય તો).
  (function(){
    try{
      const isIos = /iphone|ipad|ipod/i.test(navigator.userAgent);
      const isSafari = /safari/i.test(navigator.userAgent) && !/crios|fxios|edgios/i.test(navigator.userAgent);
      const isStandalone = window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches;
      const DISMISS_KEY = "toolkit_ios_install_tip_dismissed";
      if(isIos && isSafari && !isStandalone && !localStorage.getItem(DISMISS_KEY)){
        const tip = document.createElement('div');
        tip.className = 'ios-install-tip';
        tip.innerHTML = '<span>📲 આ એપને હોમ-સ્ક્રીન પર ઉમેરવા: નીચે Share (<b>⬆</b>) બટન → "Add to Home Screen" પસંદ કરો.</span><button type="button" aria-label="બંધ કરો">✕</button>';
        tip.querySelector('button').addEventListener('click', () => {
          tip.remove();
          try{ localStorage.setItem(DISMISS_KEY, "1"); }catch(e){}
        });
        document.body.appendChild(tip);
      }
    }catch(e){}
  })();
</script>

</body>
</html>
